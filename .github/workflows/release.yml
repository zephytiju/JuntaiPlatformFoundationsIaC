name: Publish Foundations IaC package to npm

on:
  push:
    tags: ["foundations-iac-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Verify exact release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "foundations-iac-v${version}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Publish exact npm package with OIDC provenance
        run: npm publish --access public --provenance
      - name: Verify exact registry release
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "@zephytiju/platform-foundations-iac@${version}" version 2>/dev/null || true)"
            if test "${published}" = "${version}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
