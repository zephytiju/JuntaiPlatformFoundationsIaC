name: Meridian Python runtime image

on:
  pull_request:
    paths:
      ["runtime/meridian-python/**", ".github/workflows/runtime-release.yml"]
  push:
    tags: ["meridian-runtime-python-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: pip install ruff==0.15.2
      - run: ruff check runtime/meridian-python && ruff format --check runtime/meridian-python
      - run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag meridian-runtime:ci runtime/meridian-python
      - run: python runtime/meridian-python/check_image.py meridian-runtime:ci
      - name: Read exact private consumer releases
        id: consumer-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.JUNTAI_CI_APP_ID }}
          private-key: ${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Verify clean installed service compatibility
        env:
          GH_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: python runtime/meridian-python/check_consumers.py meridian-runtime:ci --cache "$RUNNER_TEMP/consumer-wheels" --output "$RUNNER_TEMP/runtime-consumer-compatibility.json"

  publish:
    if: startsWith(github.ref, 'refs/tags/meridian-runtime-python-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: meridian-runtime-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require exact merged source and unused immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; assert os.environ["GITHUB_REF_NAME"] == "meridian-runtime-python-v" + json.load(open("runtime/meridian-python/profile.json"))["version"]'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets cannot be replaced"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image from an interrupted run
        id: existing
        run: |
          set -euo pipefail
          image="ghcr.io/zephytiju/juntai-platform-meridian-runtime-python:$GITHUB_SHA"
          if docker buildx imagetools inspect "$image" > /tmp/runtime-image.txt 2>/tmp/runtime-error.txt; then
            digest=$(awk '$1 == "Digest:" {print $2; exit}' /tmp/runtime-image.txt)
            test -n "$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -Eqi 'not found|manifest unknown' /tmp/runtime-error.txt; then
            cat /tmp/runtime-error.txt
            exit 1
          fi
      - name: Publish selected runtime with image SBOM and provenance
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: runtime/meridian-python
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/zephytiju/juntai-platform-meridian-runtime-python:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Verify published image and export exact descriptor
        env:
          RUNTIME_IMAGE: ghcr.io/zephytiju/juntai-platform-meridian-runtime-python@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE"
          python3 runtime/meridian-python/check_image.py "$RUNTIME_IMAGE"
      - name: Read exact private consumer releases
        id: consumer-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.JUNTAI_CI_APP_ID }}
          private-key: ${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Attest compatibility with the published image digest
        env:
          RUNTIME_IMAGE: ghcr.io/zephytiju/juntai-platform-meridian-runtime-python@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          GH_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 runtime/meridian-python/check_consumers.py "$RUNTIME_IMAGE" --cache "$RUNNER_TEMP/consumer-wheels" --output runtime-consumer-compatibility.json
          python3 runtime/meridian-python/release.py
      - name: Publish immutable runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" runtime-release/*
          --verify-tag --target "$GITHUB_SHA"
          --title "Platform Meridian Python runtime $GITHUB_REF_NAME"
          --notes-file runtime/meridian-python/release-notes.md
