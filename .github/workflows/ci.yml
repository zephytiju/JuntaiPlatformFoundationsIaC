name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  pulumi-preview:
    runs-on: ubuntu-latest
    needs: validate
    env:
      PULUMI_CONFIG_PASSPHRASE: ci-render-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: 3.257.0
      - run: npm ci --ignore-scripts
      - name: Create cross-repository GitHub App token
        id: juntai-ci-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.JUNTAI_CI_APP_ID }}
          private-key: ${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Verify exact service artifact evidence
        env:
          JUNTAI_GITHUB_ARTIFACT_TOKEN: ${{ steps.juntai-ci-token.outputs.token }}
        run: npm run artifacts:verify
      - run: npm run build:preview
      - name: Render fresh-stack package preview
        shell: bash
        env:
          JUNTAI_GITHUB_ARTIFACT_TOKEN: ${{ steps.juntai-ci-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulumi-state"
          pulumi login "file://${RUNNER_TEMP}/pulumi-state"
          pulumi -C preview stack init ci-preview
          pulumi -C preview preview --json --non-interactive --suppress-outputs > "${RUNNER_TEMP}/preview.json"
          jq -e '
            (.changeSummary.create >= 35) and
            ([.steps[].op | select(test("delete|replace"))] | length == 0) and
            ([.steps[] | select(.newState.type | startswith("kubernetes:")) | select(.newState.protect != true)] | length == 0)
          ' "${RUNNER_TEMP}/preview.json" >/dev/null
          jq '{changeSummary, protectedKubernetes: ([.steps[] | select((.newState.type | startswith("kubernetes:")) and (.newState.protect == true))] | length)}' "${RUNNER_TEMP}/preview.json"
