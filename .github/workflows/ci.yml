name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  deterministic-package:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and verify deterministic Core package archive
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          FOUNDATIONS_SOURCE_REVISION="${GITHUB_SHA}" SOURCE_DATE_EPOCH="${source_date_epoch}" npm run package:build
          first="$(sha256sum dist/foundations-package/platform-iac-package.v1.tar.gz)"
          FOUNDATIONS_SOURCE_REVISION="${GITHUB_SHA}" SOURCE_DATE_EPOCH="${source_date_epoch}" npm run package:build
          second="$(sha256sum dist/foundations-package/platform-iac-package.v1.tar.gz)"
          test "${first}" = "${second}"
          FOUNDATIONS_SOURCE_REVISION="${GITHUB_SHA}" SOURCE_DATE_EPOCH="${source_date_epoch}" npm run package:verify

  pulumi-preview:
    runs-on: ubuntu-latest
    needs: validate
    env:
      PULUMI_CONFIG_PASSPHRASE: ci-render-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: 3.257.0
      - run: npm ci --ignore-scripts
      - run: npm run build:preview
      - name: Render fresh-stack package preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulumi-state"
          pulumi login "file://${RUNNER_TEMP}/pulumi-state"
          pulumi -C preview stack init ci-preview
          pulumi -C preview preview --json --non-interactive --suppress-outputs > "${RUNNER_TEMP}/preview.json"
          jq -e '
            (.changeSummary.create >= 35) and
            ([.steps[].op | select(test("delete|replace"))] | length == 0) and
            ([.steps[] | select(.newState.type | startswith("kubernetes:")) | select(.newState.protect != true)] | length == 0)
          ' "${RUNNER_TEMP}/preview.json" >/dev/null
          jq '{changeSummary, protectedKubernetes: ([.steps[] | select((.newState.type | startswith("kubernetes:")) and (.newState.protect == true))] | length)}' "${RUNNER_TEMP}/preview.json"
